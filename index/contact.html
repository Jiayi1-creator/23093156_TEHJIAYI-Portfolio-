<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../cssindi/style.css">
    <title>Contact - Jia Yi</title>
</head>
<body>
    <header>
        <a href="#" class="logo">Jia Yi</a>
        <nav>
            <a href="../index/index.html">Home</a>
            <a href="../index/skills.html">Skills</a>
            <a href="../index/projects.html">Projects</a>
            <a href="../index/contact.html">Contact</a>
        </nav>
    </header>

    <section class="contact">
        <div class="contact-container">
            <div class="contact-image">
                <img src="../imagesindi/connect.png" alt="Contact Illustration">
            </div>
            <div class="contact-form">
                <h1>Get In Touch</h1>
                <form action="#" method="post" onsubmit="return validateForm()">
                    <div class="form-group">
                        <input type="text" id="name" placeholder="First Name" required>
                        <input type="text" id="lastname" placeholder="Last Name" required>
                    </div>
                    <input type="email" id="email" placeholder="Email Address" required>
                    <input type="tel" id="phone" placeholder="Phone No." required>
                    <textarea id="message" placeholder="Message" rows="5" required></textarea>
                    <button type="submit" class="btn">Send</button>
                </form>
            </div>
        </div>
    </section>

    <script src="../jsindi/scriptcontact.js"></script>
</body>
</html>
